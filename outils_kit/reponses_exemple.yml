# Réponses communes aux deux couches d'un projet : à copier sous le nom du projet
# (ex. mon-projet.yml), remplir, puis passer à copier par --data-file.
# Ce qui n'est pas ici sera demandé.
projet: "Mon projet"
slug: mon-projet
description: "Une phrase sur le but du projet."
humain: Alice              # ton prénom ou ton pseudo
github: alice/mon-projet   # compte/nom
# solo-leger | groupe-scolaire | perso-standard | perso-complet | personnalise
# (perso-standard est le préréglage « Standard », perso-complet le préréglage « Complet »)
preset: solo-leger
# avec preset: personnalise, la liste des modules :
# modules_choisis: [relectures, pistes, archives]
langage: python            # python | autre
racine: ~/dev/mon-projet   # le dossier de l'espace (couche espace seulement)
public: false              # true si le dépôt est (ou sera) public
# module groupe : les pseudos GitHub de ceux qui fusionnent
# responsables: "@alice @bob"
# espace autour d'un dépôt existant, fait sans le kit (docs/GUIDE.md, § 3.3) :
# origine: existant
# depot_travail: ~/dev/mon-projet       # le chemin de ton dépôt
# branche_principale: main
# regles_agent: AGENTS.md               # vide s'il n'y en a pas
# commande_verif: "pytest -q"           # vide s'il n'y en a pas
# docs_existants: [plan, backlog]       # parmi plan, backlog, decisions, journal, pieges
# chemin_plan: docs/ROADMAP.md
# chemin_backlog: BACKLOG.md
